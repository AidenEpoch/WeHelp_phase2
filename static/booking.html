<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/booking.css">
  <link rel="stylesheet" href="/static/signLog.css">
  <title>Booking</title>
</head>
<body>
    <nav class="navSection">
        <div class="nav">
            <div class="navLeft" onclick="location.href='/'">台北一日遊</div>
            <div class="navRight">
                <div onclick="orderSchedule()">預訂行程</div>
                <div onclick="openSignDialog()" id="signIcon">登入/註冊</div>
                <div onclick="logout(); location.href ='/'" id="logoutIcon" style="display: none;">登出系統</div>
            </div>
        </div>
    </nav>

    <div class="bookingSection">
        <div class="bookingInner">

            <!-- 歡迎訊息 -->
            <div id="welcomeMessage" class="welcomeMessage"></div>

            <!-- 有行程時顯示 -->
            <div id="tripSection" class="tripSection" style="display:none;">

                <!-- 行程卡片 -->
                <div class="tripCard">
                    <img id="tripImage" class="tripImage" src="" alt="景點圖片">
                    <div class="tripInfo">
                        <div class="tripTitle" style="font-weight: 700; display: flex;">
                            <div id="tripTitle"></div>
                        </div>
                        <div class="tripDetail" style="display: flex; font-weight: 700; font-size: 16px;">日期 : <div id="tripDate" style="font-weight: 400; margin-left: 5px;"></div></div>
                        <div class="tripDetail" style="display: flex; font-weight: 700; font-size: 16px;">時間 : <div id="tripTime" style="font-weight: 400; margin-left: 5px;"></div></div>
                        <div class="tripDetail" style="width: 174px; height: 20px; display: flex; font-weight: 700; font-size: 16px;">費用 : <div id="tripPrice" style="font-weight: 400; margin-left: 5px;"></div></div>
                        <div class="tripDetail" style="display: flex; font-weight: 700; font-size: 16px;"> 地點 : <div id="tripAddr" style="font-weight: 400; margin-left: 5px;"></div></div>
                    </div>
                    <img class="deleteBtn" onclick="deleteBooking()" src="/static/image/delete@2x.png"></img>
                </div>
                <hr class="divider">

                <!-- 聯絡資訊 -->
                <div class="formSection">
                    <div class="formTitle">您的聯絡資訊</div>
                    <div class="formRow1">
                        <label class="formLabel">聯絡姓名：</label>
                        <input type="text" id="contactName" class="formInput" placeholder="">
                    </div>
                    <div class="formRow2">
                        <label class="formLabel">連絡信箱：</label>
                        <input type="text" id="contactEmail" class="formInput" placeholder="">
                    </div>
                    <div class="formRow3">
                        <label class="formLabel">手機號碼：</label>
                        <input type="text" id="contactPhone" class="formInput" placeholder="">
                    </div>
                    <div class="formNote">請保持手機暢通，準時到達，導覽人員將用手機與您聯繫，務必留下正確的聯絡方式。</div>
                </div>

                <hr class="divider">

                <!-- 信用卡資訊 -->
                <div class="cardformSection">
                    <div class="formTitle">信用卡付款資訊</div>
                    <div class="formRowb1">
                        <label class="formLabel">卡片號碼：</label>
                        <div id="cardNumber" class="formInput tappayInput"></div>
                    </div>
                    <div class="formRowb2">
                        <label class="formLabel">過期時間：</label>
                        <div id="cardExpiry" class="formInput tappayInput"></div>
                    </div>
                    <div class="formRowb3">
                        <label class="formLabel">驗證密碼：</label>
                        <div id="cardCVV" class="formInput tappayInput"></div>
                    </div>
                </div>

                <hr class="divider">

                <!-- 結帳 -->
                <div class="checkoutSection">
                    <div id="checkoutPrice" class="checkoutPrice"></div>
                    <button class="checkoutBtn" onclick="onSubmit()">確認訂購並付款</button>
                </div>

            </div>

            <!-- 沒有行程時顯示 -->
            <div id="emptySection" class="emptySection" style="display:none;">
                目前沒有任何待預訂的行程
            </div>

        </div>
    </div>

    <footer class="footerBooked">
        <div>COPYRIGHT © 2021 台北一日遊</div>
    </footer>
</body>

<script src="/static/signLog.js"></script>
<script src="https://js.tappaysdk.com/sdk/tpdirect/v5.14.0"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
    await initAuthModal();

    const token = localStorage.getItem("token");
    if (!token) {
        window.location.href = "/";
        return;
    }

    await getInformation();
    await loadBooking();
});

async function getInformation() {
    const token = localStorage.getItem("token");
    const response = await fetch("/api/user/auth", {
        method: "GET",
        headers: { "Authorization": `Bearer ${token}` }
    });
    const result = await response.json();
    if (result.data) {
        document.getElementById("welcomeMessage").innerText =
            `您好，${result.data.name}，待預訂的行程如下：`;
        document.getElementById("contactName").value  = result.data.name;
        document.getElementById("contactEmail").value = result.data.email;
    }
}

async function loadBooking() {
    const token = localStorage.getItem("token");
    const response = await fetch("/api/booking", {
        headers: { "Authorization": `Bearer ${token}` }
    });
    const result = await response.json();

    if (!result.data) {
        document.getElementById("emptySection").style.display = "block";
        return;
    }
    

    const data = result.data;
    document.getElementById("tripSection").style.display = "block";
    document.getElementById("tripImage").src  = data.attraction.image;
    document.getElementById("tripTitle").innerText = `台北一日遊：${data.attraction.name}`;
    document.getElementById("tripDate").innerText  = `${data.date}`;
    document.getElementById("tripTime").innerText  =
        `${data.time === "morning" ? "早上 9 點到下午 4 點" : "下午 2 點到晚上 9 點"}`;
    document.getElementById("tripPrice").innerText = `新台幣 ${data.price} 元`;
    document.getElementById("tripAddr").innerText  = `${data.attraction.address}`;
    document.getElementById("checkoutPrice").innerText = `總價：新台幣 ${data.price} 元`;

    setupTayPay();
}

async function deleteBooking() {
    const token = localStorage.getItem("token");
    const response = await fetch("/api/booking", {
        method: "DELETE",
        headers: { "Authorization": `Bearer ${token}` }
    });
    const result = await response.json();
    if (result.ok) {
        location.reload();
    }
}
</script>

<script>

    function setupTayPay(){
        TPDirect.setupSDK(171059, 'app_TKD0OmWPgVShchS8NSVDNNNoQ61SYDXwcuw80bro2itdTtmDFyR9G0zK9hkO', 'sandbox');
    let fields = {
        number: {
            element: '#cardNumber',
            placeholder: '**** **** **** ****'
        },

        expirationDate: {
            element: '#cardExpiry',
            placeholder: 'MM / YY'
        },

        ccv: {
            element: '#cardCVV',
            placeholder: "ccv"
        }
    };

    TPDirect.card.setup({
        fields: fields,
        styles: {
            'input': {
                'color': 'gray'
            },
            
            'input.ccv': {
                'font-size': '16px'
            },

            'input.expiration-date': {
                'font-size': '16px'
            },

            'input.card-number': {
                'font-size': '16px'
            },

            ':focus': {
                'color': 'black'
            },

            '.valid': {
                'color': 'green'
            },

            '.invalid': {
                'color': 'red'
            },

            '@media screen and (max-width: 600px)': {
            'input': {
                'color': 'orange'
            }
            }
        },

        isMaskCreditCardNumber: true,
        maskCreditCardNumberRange: {
            beginIndex: 6,
            endIndex: 11
        }
    });
    }

    function onSubmit(){
        event.preventDefault();
        const tappayStatus = TPDirect.card.getTappayFieldsStatus();
        let phone = document.querySelector("#contactPhone").value;
        if(phone == ""){
            alert("請填寫手機號碼\n Please fill in the contact phone number");
            return;
        }

        if (tappayStatus.canGetPrime === false) {
            alert('can not get prime');
            return

        }

        TPDirect.card.getPrime(async (result) => {
        if (result.status !== 0) {
            alert('get prime error ' + result.msg);
            return;
        }

        // send prime to your server, to pay with Pay by Prime API .
        // Pay By Prime Docs: https://docs.tappaysdk.com/tutorial/zh/back.html#pay-by-prime-api
        const token = localStorage.getItem("token");
        const response = await fetch(
            "/api/orders",
            {method: "POST",
             headers: {"Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`,
                        "x-api-key": "partner_BLBCT6xn93uWXu5n0SZ2IMjrYoMdsYCrBxrEnP3lYiNkgA5jIyqhbWnT"},
             body: JSON.stringify({
                prime: result.card.prime,
                phoneNumber: phone,
                details: "TapPay Test"
             })  
            }
        );
        const orderResult = await response.json();
        const orderNumber = orderResult.data.number;
        if(orderResult.data.payment.message == "付款成功"){
            const deleteResponse = await fetch("/api/booking",{
                method: "DELETE",
                headers:{"Authorization": `Bearer ${token}`}
            })
            const deleteResult = await deleteResponse.json();
            if(deleteResult.ok){
                location.href = `/thankyou?number=${orderNumber}`;
            }
        }
        })
    }
    
</script>

</html>
